  round3_depth_sweep:
    objective: >-
      Isolate the effect of loop depth. Every earlier candidate confined the
      temporal loop to layers 19-26 (63-90% of a 30-layer Wan2.1-T2V-1.3B), so
      the rest of the depth was untested. Round 1 showed depth matters far more
      than K (a 1-to-6 ramp on 23-26 costs -0.0094 dynamic_degree versus -0.0203
      on 19-26), so this round holds K fixed and moves the window instead.
    design:
      k_min: 2
      k_max: 2
      schedule: temporal_uniform
      strength: 1.0
      note: >-
        Constant K=2 is the gentlest genuine loop, so window differences are not
        confounded by K magnitude. No k_min == k_max == 1 arm: under strength
        1.0 that degenerates to x = B(x) and is the loop-off baseline, already
        measured as k1_full_19_26 and not worth re-running.
    model_depth_layers: 30
    arms:
      - id: k2_l00_07
        k_min: 2
        k_max: 2
        layer_start: 0
        layer_end: 7
        rationale: earliest 27% of depth; never looped before
      - id: k2_l08_15
        k_min: 2
        k_max: 2
        layer_start: 8
        layer_end: 15
        rationale: 27-53% of depth; never looped before
      - id: k2_l16_23
        k_min: 2
        k_max: 2
        layer_start: 16
        layer_end: 23
        rationale: 53-80% of depth; brackets the low end of the incumbent 19-26 band
      - id: k2_l22_29
        k_min: 2
        k_max: 2
        layer_start: 22
        layer_end: 29
        rationale: 73-100% of depth; includes the final layers, brackets the high end of the incumbent band
