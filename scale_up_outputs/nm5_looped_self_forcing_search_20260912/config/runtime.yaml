workspace: looped-flow-matching
project_name: looped-flow-matching
experiment_version:
  current: 3
  archive_dir_pattern: sue-exp-history/exp-version-{id}
experiment_family: looped_self_forcing_vbench_long_search_20260912
selected_variants:
  - k1_full_19_26
  - k4_full_19_26
  - k1_k4_full_19_26
  - k1_k6_late_23_26
workflow_type: generation
default_wandb_project: looped-self-forcing-vbench-long
wandb_policy:
  mode: offline
  required: true
  syncable_artifacts: true
  reason: NM5 compute nodes use offline W&B runs; each variant must retain a local run directory and CSV row
backend:
  primary: nm5
  order:
    - nm5
goal_pipeline:
  html_tracking:
    enabled: false
    mode: static
    refresh_seconds: 20
environment:
  env_manager: conda
  env_root: scale_up_outputs/envs
  conda_root: scale_up_outputs/envs/miniconda3
  env_name: looped-self-forcing
  recovery_strategy: legacy_successful_rollout_readonly_smoke
  legacy_rollout_environment:
    reuse_authorized: true
    existence_check: read_only
    one_gpu_smoke_required: true
    new_full_build_required_before_dryrun: false
    resume_stage_after_gate: sue-dryrun
    reference_bundle: scale_up_outputs/nm5_looped_self_forcing_selected128
  overlay_root: scale_up_outputs/envs/overlay310
  vbench_cache_root: scale_up_outputs/envs/vbench_cache
  shared_asset_root: scale_up_outputs/envs
  readiness_gate:
    legacy_environment_must_exist_and_smoke: true
    current_active_bundle_required: true
    formal_checkpoint_required: Self-Forcing/checkpoints/self_forcing_dmd.pt
    checkpoint_use_ema_required: true
    wan_base_backbone_required: Self-Forcing/wan_models/Wan2.1-T2V-1.3B
    vbench_long_assets_required: true
    only_configurable_num_output_frames: 123
    new_environment_full_build_is_not_a_gate: true
    launch_forbidden_until_all_checks_pass: true
  allowed_external_roots:
    - scale_up_outputs/envs
    - .cache
  ignored_env_sources:
    - deepresearch-sandbox/config_nm5.txt
  backend_env_sources:
    nm5: runtime.yaml:backend_env.nm5
  cache_root_base: .cache
  cache_roots:
    HF_HOME: .cache/huggingface
    HF_HUB_CACHE: .cache/huggingface/hub
    TORCH_HOME: .cache/torch
    MODELSCOPE_CACHE: backend-configured
    MPLCONFIGDIR: .cache/matplotlib
    WANDB_CACHE_DIR: .cache/wandb
  required_official_evaluator_imports:
    - torch
    - av
    - vbench
  last_fullrun_preflight_json: readiness/readiness_nm5.json
backend_env:
  nm5:
    source_note: deepresearch-sandbox/config_nm5.txt
    required_keys:
      - NM5_LOGIN_SSH
      - NM5_TRANSFER_SSH
      - NM5_DEEPRESEARCH_ROOT
      - NM5_ACCOUNT
      - WANDB_MODE
      - WANDB_ENTITY
sandbox_script_folders:
  nm5: slurm_scripts
sandbox_resources:
  nm5:
    scheduler: slurm
    partition: acc
    qos: acc_ehpc
    gpu_type: H100
    gpus_per_node: 4
    cpus_per_gpu: 20
    max_nodes_per_job: 1
    default_walltime: "06:00:00"
    eval_walltime: "24:00:00"
parallelism_plan:
  title: "NM5 packed VBench-Long search round 1"
  sandbox: nm5
  gpus_per_node: 4
  per_variant_gpus: 1
  cpus_per_gpu: 20
  max_parallel: 1
  concurrent_nodes: 1
  wave_duration_minutes: 15
  packing: one four-GPU Slurm allocation with four explicit CUDA worker bindings
  dependency: generation pack must complete before the evaluation pack (afterok)
  gpu_utilization_sampling: worker nvidia-smi samples at start and every 60 seconds
  task_families:
    - name: generation
      variants: 4
      node_packs: 1
      concurrent_nodes: 1
      array_range: "pack-0"
    - name: vbench_long_eval
      variants: 4
      node_packs: 1
      concurrent_nodes: 1
      array_range: "pack-0"
  dryrun:
    title: "NM5 packed VBench-Long search dryrun"
    sandbox: nm5
    gpus_per_node: 4
    per_variant_gpus: 1
    cpus_per_gpu: 20
    max_parallel: 1
    concurrent_nodes: 1
    wave_duration_minutes: 5
    packing: one four-GPU Slurm allocation with four explicit CUDA worker bindings
    dependency: generation pack must complete before the evaluation pack (afterok)
    gpu_utilization_sampling: worker nvidia-smi samples at start and every 60 seconds
    task_families:
      - name: generation
        variants: 4
        node_packs: 1
        concurrent_nodes: 1
        array_range: "pack-0"
      - name: vbench_long_eval
        variants: 4
        node_packs: 1
        concurrent_nodes: 1
        array_range: "pack-0"
  fullrun:
    title: "NM5 packed VBench-Long search fullrun"
    sandbox: nm5
    gpus_per_node: 4
    per_variant_gpus: 1
    cpus_per_gpu: 20
    max_parallel: 1
    concurrent_nodes: 1
    wave_duration_minutes: 15
    packing: one four-GPU Slurm allocation with four explicit CUDA worker bindings
    dependency: generation pack must complete before the evaluation pack (afterok)
    gpu_utilization_sampling: worker nvidia-smi samples at start and every 60 seconds
    task_families:
      - name: generation
        variants: 4
        node_packs: 1
        concurrent_nodes: 1
        array_range: "pack-0"
      - name: vbench_long_eval
        variants: 4
        node_packs: 1
        concurrent_nodes: 1
        array_range: "pack-0"
variable:
  unit: experiment/run/config/variant
  description: One complete 128-prompt VBench-Long generation and evaluation for one temporal-loop K/layer configuration.
  owns_full_generation_workload: true
  allow_smaller_units: false
  allowed_smaller_units: []
  forbidden_launcher_side_splits:
    - prompt
    - image
    - record
    - seed
    - timestep
  required_stages:
    - generation
    - postprocess
    - vbench_long_eval
dryrun:
  full_run_unit_count: 4
  full_run_prompt_count: 128
  dryrun_variant_count: 4
  dryrun_prompt_count: 1
  static_prompt_count: 10
  dynamic_prompt_count: 118
  # Only num_output_frames is a configurable video-frame field; keep it fixed.
  num_output_frames: 123
  # Internal processing counts derived from the fixed num_output_frames value.
  # They are metadata only and are not candidate/configuration knobs.
  derived_internal_processing_counts:
    raw_decoded_frames: 489
    eval_frames: 480
  frame_count_policy: "only num_output_frames is configurable; raw/eval counts are derived internal processing counts"
  fps: 16
  duration_seconds: 30
  requested_gpu_count: 4
paths:
  scale_up_outputs_root: scale_up_outputs
  exp_dir: nm5_looped_self_forcing_search_20260912
  final_result_root: final_result
  config_root: config
  slurm_scripts_root: slurm_scripts
  outputs_root: variants
  logs_root: logs
  run_state_root: run_state
  progress_root: progress
  timings_root: timings
  reports_root: reports
  readiness_root: readiness
  generated_outputs_root: variants
  ledger_csv: artifacts/experiment_results.csv
  slurm_logs_root: logs
  wandb_root: wandb
  hf_cache_root: env/hf
  artifacts_root: artifacts
  results_root: results
  datasets_root: datasets
  envs_root: env
  ckpt_root: ckpt
  downloaded_assets_root: downloaded
output_policy:
  scale_up_outputs_inode_light: true
  loose_output_exception: one_final_result_per_gpu_or_worker
  bulk_artifact_strategy: retain_final_videos_and_tar_or_clean_split_clips_after_eval
  prompt_manifest: config/prompts_selected_128.txt
  slurm_job_name_prefix: silly-
  slurm_job_name_prefix_source: missing_or_invalid_user_yaml_defaults_to_silly
policy:
  workflow_types:
    - training
    - generation
  required_runtime_keys:
    paths:
      - scale_up_outputs_root
      - exp_dir
      - config_root
      - slurm_scripts_root
      - logs_root
      - run_state_root
      - progress_root
      - timings_root
      - reports_root
      - readiness_root
      - generated_outputs_root
      - ledger_csv
      - slurm_logs_root
      - wandb_root
      - hf_cache_root
      - artifacts_root
    environment:
      - env_manager
      - env_root
      - cache_root_base
      - cache_roots
  runtime_environment_policy:
    env_manager: backend_configured
    cache_roots_required: true
    forbid_local_env_sync: true
    private_backend_values_from: ignored_backend_config
  backend_sections:
    nm5:
      scheduler: slurm
      env_source: ignored_backend_config
      submission_host: login
  variable_policy:
    default_unit: experiment/run/config/variant
    full_generation_workload_is_atomic: true
    forbid_prompt_side_splitting: true
  output_policy:
    keep_scale_up_outputs_inode_light: true
    bulk_outputs_need_archive_or_cleanup: true
