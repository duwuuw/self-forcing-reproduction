workspace: looped-flow-matching
experiment_family: looped_self_forcing_pipeline
workflow_type: training

backend:
  primary: nm5

sandbox_script_folders:
  nm5: slurm_scripts
  autodl: slurm_scripts

sandbox_resources:
  nm5:
    scheduler: slurm
    partition: acc
    qos: acc_ehpc
    gpus_per_node: 4
    gpu_type: H100
    gpu_usable_memory_gib: 63.29
    gpu_non_torch_reserve_gib: 7.0
    max_nodes_per_job: 1
    cpus_per_gpu: 20
    timeout_kill_after_seconds: 300
    finalization_grace_seconds: 600
    train_gpus: 4
    infer_gpus: 1
  autodl:
    scheduler: tmux
    train_gpus: 4
    infer_gpus: 1

backend_env:
  nm5:
    source_note: deepresearch-sandbox/config_nm5.txt
    required_keys:
      - NM5_DEEPRESEARCH_ROOT
      - NM5_WORKSPACE_ROOT
      - NM5_ACCOUNT
      - NM5_LOGIN_SSH
      - NM5_HF_HOME
      - NM5_HF_HUB_CACHE
      - NM5_MODELSCOPE_CACHE
      - NM5_TORCH_HOME
      - NM5_MPLCONFIGDIR
      - NM5_WANDB_CACHE_DIR
      - WANDB_API_KEY
      - WANDB_ENTITY

environment:
  # Paths resolve relative to NM5_WORKSPACE_ROOT on the backend. The overlay
  # is a lightweight Hydra-only directory beneath this bundle.
  env_manager: conda
  env_root: scale_up_outputs/envs
  python_binary: scale_up_outputs/envs/miniconda3/envs/looped-self-forcing/bin/python
  asset_root: Self-Forcing-blockwise-layerwise
  python_overlay: envs/hydra_overlay
  allowed_external_roots:
    - scale_up_outputs/envs
    - Self-Forcing-blockwise-layerwise
  cache_env_sources:
    HF_HOME: NM5_HF_HOME
    HF_HUB_CACHE: NM5_HF_HUB_CACHE
    MODELSCOPE_CACHE: NM5_MODELSCOPE_CACHE
    TORCH_HOME: NM5_TORCH_HOME
    MPLCONFIGDIR: NM5_MPLCONFIGDIR
    WANDB_CACHE_DIR: NM5_WANDB_CACHE_DIR

autotune_hyperparam:
  skip: true
  waiver_reason: "Operator confirmed two fixed, versioned K/LR comparisons; no autotune sweep is requested."

paths:
  # Operational roots below are bundle-relative; scale_up_outputs_root and exp_dir
  # identify the bootstrap bundle and are not nested output path components.
  scale_up_outputs_root: scale_up_outputs
  exp_dir: looped_self_forcing_pipeline
  config_root: config
  autotune_hyperparam_root: autotune_hyperparam
  slurm_scripts_root: slurm_scripts
  logs_root: logs
  datasets_root: datasets
  ckpt_root: ckpt
  artifacts_root: artifacts
  final_result_root: final_result
  state_root: state
  readiness_root: readiness
  ledger_csv: artifacts/experiment_results.csv

policy:
  wandb_policy:
    mode: offline
    required: true
